filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/log/*.log
    - /logs/sample/*.log

output.kafka:
  hosts: ["kafka:9092"]
  topic: logs_raw
  partition.round_robin:
    reachable_only: false
  required_acks: 1
  compression: gzip
  max_message_bytes: 10485760

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644