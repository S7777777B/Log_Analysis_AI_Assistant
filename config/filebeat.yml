filebeat.inputs:
  # 系统日志
  - type: log
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/auth.log
    fields:
      log_type: system
      source: linux
    fields_under_root: true
    multiline.pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
    multiline.negate: true
    multiline.match: after

  # VPN 日志（确保目录存在）
  - type: log
    enabled: true
    paths:
      - /var/log/vpn/*.log
    fields:
      log_type: vpn
      source: vpn_server
    fields_under_root: true

  # OA 系统日志（确保目录存在）
  - type: log
    enabled: true
    paths:
      - /var/log/oa/*.log
    fields:
      log_type: oa
      source: oa_system
    fields_under_root: true

  # Nginx 访问日志（如果没有安装 Nginx，可以暂时注释）
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      log_type: nginx_access
      source: nginx
    fields_under_root: true

  # API 日志（确保目录存在）
  - type: log
    enabled: true
    paths:
      - /var/log/api/*.log
    fields:
      log_type: api
      source: api_server
    fields_under_root: true

# processors（简化版）
processors:
  - add_host_metadata: ~
  # timestamp 处理器已移除，后续可用 dissect 提取时间

# 输出到 Kafka（使用默认值）
output.kafka:
  hosts: ["${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"]
  topic: "${KAFKA_LOGS_TOPIC:logs_raw}"
  compression: gzip
  required_acks: 1
  max_retries: 3
  backoff:
    init: 1s
    max: 10s

logging.level: info
logging.to_files: true
logging.files:
  path: ${LOG_OUTPUT_DIR:./filebeat_logs}
  name: filebeat.log
  keepfiles: 7
  permissions: 0644